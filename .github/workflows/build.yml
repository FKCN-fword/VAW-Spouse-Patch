name: Build SKSE Plugin

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest

    env:
      VCPKG_BINARY_SOURCES: 'clear;x-gha,readwrite'

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive

      # ---------------------------------------------------------------
      # vcpkg (library manager). The custom registry used by
      # CommonLibSSE-NG is declared in vcpkg-configuration.json, so we
      # only need a vcpkg checkout here.
      # ---------------------------------------------------------------
      - name: Setup vcpkg
        uses: lukka/run-vcpkg@v11
        with:
          vcpkgDirectory: '${{ github.workspace }}/vcpkg'
          vcpkgGitCommitId: 'a42af01b72c28a8e1d7b48107b33e4f286a55ef6'
          runVcpkgInstall: true

      # ---------------------------------------------------------------
      # Configure + build. We call CMake directly so every step shows
      # up clearly in the log (much easier to debug than a wrapper).
      # ---------------------------------------------------------------
      - name: Configure (CMake)
        shell: pwsh
        run: |
          cmake -S . -B build -G "Visual Studio 17 2022" -A x64 `
            -DCMAKE_TOOLCHAIN_FILE="${{ github.workspace }}/vcpkg/scripts/buildsystems/vcpkg.cmake" `
            -DCMAKE_BUILD_TYPE=Release

      - name: Build (Release)
        shell: pwsh
        run: cmake --build build --config Release --parallel

      # ---------------------------------------------------------------
      # Collect the DLL and fail loudly if it is not there.
      # ---------------------------------------------------------------
      - name: Collect artifact
        shell: pwsh
        run: |
          Write-Host "Looking for VAWSpouseSwitcher.dll ..."
          $dll = Get-ChildItem -Path build -Recurse -Filter "VAWSpouseSwitcher.dll" |
                 Select-Object -First 1
          if (-not $dll) {
            Write-Host "--- all .dll files produced ---"
            Get-ChildItem -Path build -Recurse -Include *.dll |
              Select-Object -ExpandProperty FullName
            throw "VAWSpouseSwitcher.dll was not produced."
          }
          New-Item -ItemType Directory -Force -Path out | Out-Null
          Copy-Item $dll.FullName -Destination out/VAWSpouseSwitcher.dll
          Write-Host "OK: $($dll.FullName)"

      - name: Upload DLL
        uses: actions/upload-artifact@v4
        with:
          name: VAWSpouseSwitcher-dll
          path: out/VAWSpouseSwitcher.dll
          if-no-files-found: error
