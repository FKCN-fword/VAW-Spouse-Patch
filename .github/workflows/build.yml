name: Build SKSE Plugin

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest

    env:
      VCPKG_INSTALLED_DIR: ${{ github.workspace }}\vcpkg_installed

    steps:
      - name: Checkout plugin sources
        uses: actions/checkout@v4

      - name: Checkout vcpkg
        uses: actions/checkout@v4
        with:
          repository: microsoft/vcpkg
          ref: fc3f61366102c1f0d4547c06d03c523bb18c13a7
          path: vcpkg

      - name: Bootstrap vcpkg
        shell: pwsh
        run: .\vcpkg\bootstrap-vcpkg.bat

      - name: Install dependencies
        shell: pwsh
        run: .\vcpkg\vcpkg.exe install --triplet x64-windows

      - name: Configure (CMake)
        shell: pwsh
        run: cmake -S . -B build -G "Visual Studio 17 2022" -A x64 "-DCMAKE_TOOLCHAIN_FILE=${{ github.workspace }}\vcpkg\scripts\buildsystems\vcpkg.cmake" "-DVCPKG_TARGET_TRIPLET=x64-windows"

      - name: Build (Release)
        shell: pwsh
        run: cmake --build build --config Release --parallel

      - name: Collect artifact
        shell: pwsh
        run: |
          $dll = Get-ChildItem -Path build -Recurse -Filter "VAWSpouseSwitcher.dll" | Select-Object -First 1
          if (-not $dll) {
            Write-Host "--- all .dll files produced ---"
            Get-ChildItem -Path build -Recurse -Include *.dll | Select-Object -ExpandProperty FullName
            throw "VAWSpouseSwitcher.dll was not produced."
          }
          New-Item -ItemType Directory -Force -Path out | Out-Null
          Copy-Item $dll.FullName out\VAWSpouseSwitcher.dll
          Write-Host "OK: $($dll.FullName)"

      - name: Upload DLL
        uses: actions/upload-artifact@v4
        with:
          name: VAWSpouseSwitcher-dll
          path: out/VAWSpouseSwitcher.dll
          if-no-files-found: error
