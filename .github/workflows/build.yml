name: Build SKSE Plugin

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest

    env:
      VCPKG_ROOT: ${{ github.workspace }}\vcpkg

    steps:
      - name: Checkout plugin sources
        uses: actions/checkout@v4

      # vcpkg must be a real git repository with history, because the
      # manifest pins "builtin-baseline" to a specific older commit and
      # vcpkg resolves that commit with `git show`. A shallow checkout
      # (e.g. via actions/checkout) is NOT enough - it would fail with
      # "failed to `git show` versions/baseline.json".
      - name: Clone vcpkg with full history
        shell: pwsh
        run: git clone https://github.com/microsoft/vcpkg.git "$env:VCPKG_ROOT"

      - name: Bootstrap vcpkg
        shell: pwsh
        run: "& $env:VCPKG_ROOT\bootstrap-vcpkg.bat -disableMetrics"

      - name: Install dependencies
        shell: pwsh
        run: "& $env:VCPKG_ROOT\vcpkg.exe install --triplet x64-windows"

      - name: Show vcpkg logs on failure
        if: failure()
        shell: pwsh
        run: |
          Write-Host "=============== vcpkg buildtrees logs ==============="
          Get-ChildItem -Path "$env:VCPKG_ROOT\buildtrees" -Recurse -Include *.log -ErrorAction SilentlyContinue |
            ForEach-Object {
              Write-Host ""
              Write-Host "########## $($_.FullName) ##########"
              Get-Content $_.FullName -Tail 60
            }

      - name: Configure (CMake)
        shell: pwsh
        run: |
          cmake -S . -B build -G "Visual Studio 17 2022" -A x64 `
            "-DCMAKE_TOOLCHAIN_FILE=$env:VCPKG_ROOT\scripts\buildsystems\vcpkg.cmake" `
            "-DVCPKG_TARGET_TRIPLET=x64-windows"

      - name: Build (Release)
        shell: pwsh
        run: cmake --build build --config Release --parallel

      - name: Collect artifact
        shell: pwsh
        run: |
          $dll = Get-ChildItem -Path build -Recurse -Filter "VAWSpouseSwitcher.dll" | Select-Object -First 1
          if (-not $dll) {
            Write-Host "--- all .dll files produced ---"
            Get-ChildItem -Path build -Recurse -Include *.dll | Select-Object -ExpandProperty FullName
            throw "VAWSpouseSwitcher.dll was not produced."
          }
          New-Item -ItemType Directory -Force -Path out | Out-Null
          Copy-Item $dll.FullName out\VAWSpouseSwitcher.dll
          Write-Host "OK: $($dll.FullName)"

      - name: Upload DLL
        uses: actions/upload-artifact@v4
        with:
          name: VAWSpouseSwitcher-dll
          path: out/VAWSpouseSwitcher.dll
          if-no-files-found: error
